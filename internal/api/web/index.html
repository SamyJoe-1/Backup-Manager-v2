<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 11c0-2 3-3 7-3s7 1 7 3v10c0 2-3 3-7 3s-7-1-7-3z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M9 16c0 2 3 3 7 3s7-1 7-3' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f6fa;--panel:#fff;--line:#e4e7ee;--text:#151a2d;--mute:#69718a;--brand:#4f46e5;--brand2:#7c3aed;--soft:#eef0ff;--ok:#0f9d6b;--okbg:#e3f7ee;--bad:#d43a4c;--badbg:#fde8ea;--warn:#b7791f;--warnbg:#fdf3dc;--info:#2563eb;--infobg:#e6efff;--shadow:0 1px 2px rgba(20,25,50,.06),0 8px 24px rgba(20,25,50,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1020;--panel:#161a2e;--line:#272c47;--text:#e8eaf6;--mute:#8f96b3;--soft:#22264a;--okbg:#0f3a2c;--badbg:#45161d;--warnbg:#40300f;--infobg:#15264d;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme=dark]{--bg:#0d1020;--panel:#161a2e;--line:#272c47;--text:#e8eaf6;--mute:#8f96b3;--soft:#22264a;--okbg:#0f3a2c;--badbg:#45161d;--warnbg:#40300f;--infobg:#15264d;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 10px 18px}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-style:normal}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--mute);font-weight:500}
nav a:hover{background:var(--soft);color:var(--text)}
nav a.on{background:var(--soft);color:var(--brand)}
nav a b{margin-inline-start:auto;background:var(--brand);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.foot{margin-top:auto;font-size:12px;color:var(--mute);padding:10px}
main{padding:26px 30px;min-width:0}
h1{font-size:22px;margin:0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.head p{margin:2px 0 0;color:var(--mute)}
.head .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.tile{padding:16px 18px}
.tile small{color:var(--mute);font-weight:500}
.tile div{font-size:24px;font-weight:700;margin-top:4px}
.tile em{font-style:normal;font-size:12px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.red:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line);align-items:center}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.bar input[type=search]{flex:1;min-width:180px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:12px;color:var(--mute);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--text)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--soft)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.mute{color:var(--mute)}.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand);white-space:nowrap}
.pill.done{background:var(--okbg);color:var(--ok)}.pill.failed{background:var(--badbg);color:var(--bad)}
.pill.running{background:var(--infobg);color:var(--info)}.pill.queued,.pill.cancelled{background:var(--warnbg);color:var(--warn)}
.pill.running::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;min-width:120px;margin-top:5px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .5s}
.pager{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.pager .sp{flex:1}
.empty{padding:46px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.5);display:flex;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{margin:auto;width:min(620px,94vw);max-height:92vh;overflow:auto;padding:22px}
.drawer{margin-inline-start:auto;width:min(860px,100vw);height:100vh;overflow:auto;border-radius:0;padding:24px}
.modal h2,.drawer h2{margin:0 0 4px;font-size:18px}
.f{display:grid;gap:5px;margin-top:13px}
.f label{font-weight:600;font-size:13px}
.f small{color:var(--mute)}
.f input,.f select,.f textarea{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:7px 13px;cursor:pointer;font-weight:500;border-right:1px solid var(--line)}
.seg label:last-child{border:0}
.seg input{display:none}
.seg label:has(input:checked){background:var(--soft);color:var(--brand);font-weight:600}
.pick{border:1px solid var(--line);border-radius:9px;max-height:240px;overflow:auto;padding:6px}
.pick label{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;font-weight:400;cursor:pointer}
.pick label:hover{background:var(--soft)}
.pick label span{margin-inline-start:auto;color:var(--mute);font-size:12px}
.pick .db{font-weight:700;margin-top:4px}
.pick input{width:auto}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:14px 0}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
pre{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;overflow:auto;font-size:12px;margin:8px 0}
.toast{position:fixed;inset-inline-end:20px;bottom:20px;z-index:99;display:grid;gap:8px}
.toast div{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:420px;animation:fade .2s}
.toast div.err{background:var(--bad);color:#fff}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 20% 0,var(--soft),transparent),var(--bg)}
.auth .card{width:min(400px,100%);padding:28px}
.banner{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner.bad{background:var(--badbg);color:var(--bad)}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:8px}.logo{padding:4px 8px}.foot{display:none}nav{display:flex;flex-wrap:wrap}main{padding:16px}.kv{grid-template-columns:1fr}}
[dir=rtl] body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif}[dir=rtl] .mono,[dir=rtl] pre{direction:ltr;text-align:left;unicode-bidi:embed}[dir=rtl] td[style*="text-align:right"]{text-align:left!important}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const v = vals[i - 1];

}));
async function api(method, path, body) {

  if (res.status === 401 && state.user) { state.user = null; render(); }
  if (!res.ok) throw new Error((data && data.error) || ("Request failed (" + res.status + ")"));
  return data;
}

"done":"تمت","failed":"فشلت","running":"تعمل","queued":"في الانتظار","cancelled":"أُلغيت","verified":"تم التحقق","verify failed":"فشل التحقق","restore tested":"اختُبر الاسترجاع","restore test failed":"فشل اختبار الاسترجاع",
"Close":"إغلاق","Cancel":"إلغاء","Confirm":"تأكيد","Save":"حفظ","Delete":"حذف","Edit":"تعديل","Add":"إضافة","Test":"اختبار","Run now":"تشغيل الآن","Save plan":"حفظ الخطة","New plan":"خطة جديدة","New set":"مجموعة جديدة","Save set":"حفظ المجموعة",

"The queue. Long jobs keep running when you close this page, and continue after a restart.":"قائمة الانتظار. المهام الطويلة تستمر عند إغلاق الصفحة وتُستأنف بعد إعادة التشغيل.","Any state":"أي حالة",
"Where to send alerts.":"إلى أين تُرسل التنبيهات.","Telegram bot token":"رمز بوت تيليغرام","Telegram chat id":"معرّف محادثة تيليغرام","Webhook address":"عنوان Webhook","Save and send a test":"حفظ وإرسال تجربة",
"Who did what: sign-ins, downloads, deletions, changes.":"من فعل ماذا: تسجيلات الدخول، التنزيلات، الحذف، التغييرات.","When":"متى","Who":"من","Action":"الإجراء","Detail":"التفاصيل","From":"من عنوان",
"Who can sign in, what each one may do, and tokens for scripts.":"من يستطيع الدخول، وما يُسمح لكل واحد، ورموز للسكربتات.","My account":"حسابي","Change password":"تغيير كلمة المرور","Turn on two-factor sign-in":"تفعيل التحقق بخطوتين","Turn off two-factor":"إيقاف التحقق بخطوتين","Accounts":"الحسابات","Add account":"إضافة حساب","Role":"الدور","Two-factor":"التحقق بخطوتين","Since":"منذ","API tokens":"رموز API","New token":"رمز جديد","Revoke":"إبطال","Created":"أُنشئ","Last used":"آخر استخدام",
"Run several plans together, for example one per shard, and keep track of which backups belong to the same moment.":"شغّل عدة خطط معاً، مثلاً خطة لكل شارد، واعرف أي النسخ تعود لنفس اللحظة.","Run":"التشغيل","Members":"الأعضاء","Usable together":"قابلة للاستخدام معاً","complete":"مكتملة","incomplete":"غير مكتملة",
"Search id, plan, database, note…":"ابحث بالمعرّف، الخطة، القاعدة، الملاحظة…","Search every column…":"ابحث في كل الأعمدة…","Filter tables…":"تصفية الجداول…","Filter…":"تصفية…","Add a note…":"أضف ملاحظة…","Add filter":"إضافة فلتر","Export CSV":"تصدير CSV","Close sandbox":"إغلاق البيئة التجريبية","Rows inside the backup":"الصفوف داخل النسخة","Start restore":"بدء الاسترجاع","Restore as a new table":"استرجاع كجدول جديد"};

// ---------- state & routing ----------
const state = { user: null, setupNeeded: false, version: "", held: false, progress: {}, lists: {} };
const pages = {};
const NAV = [["dashboard","Dashboard"],["backups","Backups"],["plans","Plans"],["sets","Sets"],["targets","Databases"],["destinations","Destinations"],["jobs","Jobs"],["settings","Settings"],["access","Users & access"],["audit","Activity"]];
const OWNER_ONLY = ["settings", "audit"];
const route = () => (location.hash.replace(/^#\/?/, "").split("?")[0]) || "dashboard";

async function boot() {
  const s = await api("GET", "/state"); Object.assign(state, s);
  render();
  if (state.user) connect();
}
function render() {
  const root = $("#root");
  if (!state.user) { root.innerHTML = authView(); bindAuth(); return; }
  const r = pages[route()] ? route() : "dashboard";
  root.innerHTML = html`<div class="app"><aside>
    <div class="logo"><i>⛁</i> Backup Manager</div>
    <nav>${NAV.filter(([k]) => state.user.role === "owner" || !OWNER_ONLY.includes(k)).map(([k, t]) => html`<a href="#/${k}" class="${k === r ? "on" : ""}">${t}${k === "jobs" ? raw('<b id="jobBadge" hidden></b>') : ""}</a>`)}</nav>

// ---------- live events (one push connection, no polling) ----------
let es, refreshTimer;
function connect() {
  if (es) es.close();
  es = new EventSource("/api/events");
  es.onmessage = m => {
    const { event, data } = JSON.parse(m.data);
    if (event === "progress") { state.progress[data.id] = data.progress; if (data.backupId) state.progress["b:" + data.backupId] = data.progress; paintProgress(); return; }
    if (event === "hold") state.held = data;
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => { if (!$(".ov") && state.reload) state.reload(); badge(); }, 400);
  };
}
function progressView(p) {
  if (!p || !p.phase) return "";
  const pct = p.estBytes > 0 ? Math.min(99, Math.round(p.rawBytes / p.estBytes * 100)) : (p.tablesTotal ? Math.round(p.tablesDone / p.tablesTotal * 100) : 0);
  return html`<div class="small mute">${p.phase}${p.table ? " · " + p.table : ""} · ${p.tablesDone}/${p.tablesTotal} tables · ${num(p.rows)} rows · ${bytes(p.rawBytes)}${p.speed ? " · " + bytes(p.speed) + "/s" : ""}</div><div class="prog"><i style="width:${pct}%"></i></div>`.s;
}
function paintProgress() { document.querySelectorAll("[data-prog]").forEach(el => { const p = state.progress[el.dataset.prog]; if (p) el.innerHTML = progressView(p); }); }
const badge = run(async () => { const d = await api("GET", "/dashboard"); const b = $("#jobBadge"); if (!b) return; const n = d.running + d.queued; b.hidden = !n; b.textContent = n; });

// ---------- generic bits ----------
function modal(inner, cls = "modal") {
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="card ${cls}">${inner}</div>`;
  ov.onmousedown = e => { if (e.target === ov) close(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  function close() { ov.remove(); document.removeEventListener("keydown", onKey); }
  document.addEventListener("keydown", onKey);
  document.body.append(ov);
  ov.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  return { el: ov, close };
}
function confirmBox(title, text, word) {
  return new Promise(res => {
    const m = modal(html`<h2>${title}</h2><p class="mute">${text}</p>
      ${word ? html`<div class="f"><label>Type <span class="mono">${word}</span> to confirm</label><input id="cw" autocomplete="off"></div>` : ""}
      <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="cy">Confirm</button></div>`.s);
    $("#cy", m.el).onclick = () => { if (word && $("#cw", m.el).value !== word) return toast("The text does not match.", true); m.close(); res(true); };
  });
}
const head = (title, sub, actions = "") => html`<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><span class="sp"></span>${raw(String(actions))}</div>`.s;
function pager(total, page, size, onPage) {
  const pages = Math.max(1, Math.ceil(total / size));
  const el = document.createElement("div"); el.className = "pager";
  el.innerHTML = html`<span>${num(total)} total</span><span class="sp"></span><button class="btn sm" ${page <= 1 ? raw("disabled") : ""} data-p="${page - 1}">‹ Previous</button><span>Page ${page} of ${pages}</span><button class="btn sm" ${page >= pages ? raw("disabled") : ""} data-p="${page + 1}">Next ›</button>`.s;
  el.querySelectorAll("button").forEach(b => b.onclick = () => onPage(+b.dataset.p));
  return el;
}

function waitJob(jobId) {
  return new Promise((res, rej) => { const prev = es.onmessage;
    const h = m => { prev(m); const { event, data } = JSON.parse(m.data);
      if (event === "job" && data.id === jobId && ["done","failed","cancelled"].includes(data.state)) { es.onmessage = prev; data.state === "done" ? res() : rej(new Error(data.error || "the job was " + data.state)); } };
    es.onmessage = h; });
}
async function openRows(b, db, table) {

    await waitJob(r.jobId);

    const paint = q => { const list = st.tables.filter(t => (t.db + "." + t.name).toLowerCase().includes(q)).slice(0, 200);
      $("#ptl", box).innerHTML = html`<table><tbody>${list.map((t, i) => html`<tr class="click" data-t="${i}"><td><b>${t.name}</b><div class="small mute">${t.db}</div></td><td class="mute">~${num(t.rows)} rows · ${bytes(t.bytes)}</td></tr>`)}</tbody></table>`.s;
      $("#ptl", box).querySelectorAll("[data-t]").forEach(tr => tr.onclick = () => { const t = list[+tr.dataset.t]; db = t.db; table = t.name; grid(); }); };

  };
  const OPS = [["contains","contains"],["eq","="],["ne","≠"],["gt",">"],["ge","≥"],["lt","<"],["le","≤"],["starts","starts with"],["null","is empty (NULL)"],["notnull","is not NULL"]];

    const d = await api("GET", `/backups/${b.id}/rows?` + qs());
    box.innerHTML = html`<div class="card"><div class="bar">
        <input type="search" id="rq" placeholder="Search every column…" value="${f.search}">
        <select id="fc"><option value="">Filter by column…</option>${d.columns.map(c => html`<option>${c.name}</option>`)}</select>
        <select id="fo">${OPS.map(([v, t]) => html`<option value="${v}">${t}</option>`)}</select><input id="fv" placeholder="value" style="width:150px"><button class="btn sm" id="fa2">Add filter</button>
        <a class="btn sm" id="csv" href="/api/backups/${b.id}/rows?${qs()}&format=csv">Export CSV</a></div>
      ${f.filters.length ? html`<div class="bar">${f.filters.map((x, i) => html`<span class="pill">${x.column} ${(OPS.find(o => o[0] === x.op) || [])[1]} ${x.value} <a href="#" data-rm="${i}">✕</a></span>`)}</div>` : ""}
      <div class="tw" style="max-height:62vh;overflow:auto"><table><thead><tr>${d.columns.map(c => html`<th class="s" data-sort="${c.name}" title="${c.type}">${c.key ? "🔑 " : ""}${c.name}${f.sort === c.name ? (f.dir === "asc" ? " ↑" : " ↓") : ""}</th>`)}</tr></thead>
      <tbody>${d.rows.length ? d.rows.map(r => html`<tr>${r.map(v => v === null ? raw('<td class="mute">NULL</td>') : html`<td class="mono" style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${String(v).slice(0, 600)}">${v}</td>`)}</tr>`) : html`<tr><td class="empty" colspan="${d.columns.length}">No rows match.</td></tr>`}</tbody></table></div><div id="rp"></div></div>`.s;

function endpointPage(kind, title, sub, fields, describe) {
  pages[kind] = async main => {
    state.reload = null;
    const list = await api("GET", "/" + kind);
    main.innerHTML = head(title, sub, `<button class="btn pri" id="add">Add</button>`) + html`<div class="card"><div class="tw">${list.length ? html`<table><thead><tr><th>Name</th><th>Details</th><th id="res"></th><th></th></tr></thead><tbody>${list.map(e => html`<tr><td><b>${e.name}</b><div class="small mute">${e.kind}${e.cfg.agent ? " · via agent " + ((agents.find(a => a.id === e.cfg.agent) || {}).name || e.cfg.agent) : ""}</div></td><td class="mono">${describe(e)}</td><td class="small" data-res="${e.id}"></td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-test="${e.id}">Test</button> <button class="btn sm" data-edit="${e.id}">Edit</button> <button class="btn sm red" data-del="${e.id}">Delete</button></td></tr>`)}</tbody></table>` : raw(`<div class="empty"><b>Nothing here yet</b>Click Add to create the first one.</div>`)}</div></div>`.s;
    const agents = kind === "targets" && state.user.role === "owner" ? await api("GET", "/agents") : [];
    const form = e => {
      const c = e ? e.cfg : {}, k0 = e ? e.kind : fields.kinds[0][0];
      const m = modal(html`<form id="ef"><h2>${e ? "Edit" : "Add"}</h2><div class="f"><label>Name</label><input name="name" required value="${e?.name || ""}"></div>
        ${fields.kinds.length > 1 ? html`<div class="f"><label>Kind</label><select name="kind">${fields.kinds.map(([v, t]) => html`<option value="${v}" ${v === k0 ? raw("selected") : ""}>${t}</option>`)}</select></div>` : html`<input type="hidden" name="kind" value="${k0}">`}
        <div id="ff"></div>${agents.length ? html`<div class="f"><label>Runs on</label><select name="agent"><option value="0">This server</option>${agents.map(a => html`<option value="${a.id}" ${c.agent === a.id ? raw("selected") : ""}>Agent: ${a.name}${a.online ? "" : " (offline)"}</option>`)}</select><small>With an agent, host and paths are as seen from the agent's server. Use an S3 destination so the panel can read the backups too.</small></div>` : ""}
        <div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Save</button></div></form>`.s);
      const f = $("#ef", m.el);
      const paint = () => $("#ff", f).innerHTML = fields.of(f.kind.value).map(([n, label, type, hint, def]) => html`<div class="f"><label>${label}</label>${type === "lines" ? html`<textarea name="${n}" rows="4" class="mono">${(c[n] || def || []).join("\n")}</textarea>` : type === "checkbox" ? html`<input type="checkbox" name="${n}" style="width:auto" ${c[n] ? raw("checked") : ""}>` : html`<input name="${n}" type="${type}" value="${type === "password" ? "" : (c[n] ?? def ?? "")}" placeholder="${type === "password" && e ? "leave empty to keep the stored one" : ""}" autocomplete="off">`}${hint ? html`<small>${hint}</small>` : ""}</div>`).join("");
      paint(); if (f.kind.tagName === "SELECT") f.kind.onchange = paint;
      f.onsubmit = run(async ev => {
        ev.preventDefault();
        const cfg = {}; let secret;
        for (const [n, , type] of fields.of(f.kind.value)) { const el = f[n]; if (type === "password") secret = el.value; else if (type === "lines") cfg[n] = el.value.split("\n").map(x => x.trim()).filter(Boolean); else if (type === "checkbox") cfg[n] = el.checked; else if (type === "number") { if (el.value) cfg[n] = +el.value; } else if (el.value.trim()) cfg[n] = el.value.trim(); }
        if (f.agent && +f.agent.value) cfg.agent = +f.agent.value;
        await api(e ? "PUT" : "POST", "/" + kind + (e ? "/" + e.id : ""), { name: f.name.value, kind: f.kind.value, cfg, secret });
        m.close(); toast("Saved"); pages[kind](main);
      });
    };
    $("#add").onclick = () => form(null);
    main.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => form(list.find(e => e.id == b.dataset.edit)));
    main.querySelectorAll("[data-del]").forEach(b => b.onclick = run(async () => { if (!await confirmBox("Delete?", "Stored backups are not touched.")) return; await api("DELETE", `/${kind}/${b.dataset.del}`); pages[kind](main); }));
    main.querySelectorAll("[data-test]").forEach(b => b.onclick = async () => {
      const cell = main.querySelector(`[data-res="${b.dataset.test}"]`); cell.textContent = "testing…"; cell.style.color = "";
      try { const r = await api("POST", `/${kind}/${b.dataset.test}/test`, {}); cell.style.color = "var(--ok)";
        cell.textContent = kind === "targets" ? `OK · ${r.version}${r.tables !== undefined ? " · " + r.tables + (r.version.startsWith("PostgreSQL") ? " databases" : " tables") : ""}${r.bytes !== undefined ? " · " + bytes(r.bytes) : ""}${r.readOnly ? " · replica (read-only)" : ""}` : "OK" + (r.free >= 0 ? " · " + bytes(r.free) + " free" : ""); }
      catch (e) { cell.style.color = "var(--bad)"; cell.textContent = e.message; }
    });
  };
}

boot().catch(e => { $("#root").innerHTML = `<div class="auth"><div class="card" style="padding:28px">Cannot reach the server: ${esc(e.message)}</div></div>`; });
</script>
</body>
</html>
